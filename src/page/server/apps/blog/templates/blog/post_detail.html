{% extends "blog/base.html" %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
  <article class="prose prose-slate max-w-none">
    <h1 class="text-4xl font-bold">{{ post.title }}</h1>
    <p class="text-sm text-slate-500">{{ post.created_at|date:"d E Y" }}</p>
    <div class="mt-6 text-lg whitespace-pre-wrap">{{ post.body }}</div>
  </article>

  <section class="mt-12 border-t border-slate-200 pt-8">
    <h2 class="mb-4 text-lg font-semibold">Комментарии</h2>
{% comment %} 
    <div id="comments">
      {% include "partials/comment_list.html" %}
    </div> {% endcomment %}

    <form class="mt-6 space-y-3"
          hx-post="{% url 'blog:add_comment' post.slug %}"
          hx-target="#comments"
          hx-swap="innerHTML">
      {% csrf_token %}
      <input name="author_name" required placeholder="Аноним"
             class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
      <textarea name="body" required rows="3" placeholder="Комментарий"
                class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"></textarea>
      <button type="submit"
              class="btn">
        Отправить
      </button>
    </form>
  </section>
{% endblock %}
