{% extends "blog/base.html" %}

{% block content %}
  <div class="mb-8 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
    <div>
      <h1 class="text-3xl font-bold tracking-tight">Мысли</h1>
    </div>

    <form hx-get="{% url 'blog:home' %}"
          hx-target="#post-list"
          hx-push-url="true"
          class="flex gap-4">
        <input type="search" name="q" value="{{ q }}"
          placeholder="Поиск"
          class="input input-neutral">
        <button type="submit" class="btn">Найти</button>
    </form>
  </div>

  <div id="post-list">
    {% include "partials/post_list.html" %}
  </div>
{% endblock %}
