<article class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm transition hover:border-indigo-200">
  <a href="{% url 'blog:post_detail' post.slug %}" class="block">
    <h2 class="text-xl font-semibold text-slate-900 hover:text-indigo-600">{{ post.title }}</h2>
    <p class="mt-2 text-sm text-slate-500">{{ post.created_at|date:"d E Y" }}</p>
    {% if post.excerpt %}
      <p class="mt-3 text-slate-600">{{ post.excerpt }}</p>
    {% endif %}
  </a>
</article>
