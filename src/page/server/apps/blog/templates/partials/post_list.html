<div class="space-y-4">
  {% for post in page %}
    {% include "partials/post_card.html" %}
  {% empty %}
    <p class="rounded-xl border border-dashed border-slate-300 bg-white p-8 text-center text-slate-500">
      Пока нет постов.
    </p>
  {% endfor %}
</div>

{% if page.paginator.num_pages > 1 %}
  <div class="mt-8 flex justify-center gap-2">
    {% if page.has_previous %}
      <a class="rounded-lg border px-3 py-1.5 text-sm hover:bg-white"
         hx-get="?page={{ page.previous_page_number }}{% if q %}&q={{ q }}{% endif %}"
         hx-target="#post-list"
         hx-push-url="true">←</a>
    {% endif %}
    <span class="px-3 py-1.5 text-sm text-slate-500">
      {{ page.number }} / {{ page.paginator.num_pages }}
    </span>
    {% if page.has_next %}
      <a class="rounded-lg border px-3 py-1.5 text-sm hover:bg-white"
         hx-get="?page={{ page.next_page_number }}{% if q %}&q={{ q }}{% endif %}"
         hx-target="#post-list"
         hx-push-url="true">→</a>
    {% endif %}
  </div>
{% endif %}
